auditConfig:
  # GHSA-mrhx-c7xc-m3w5: zod memory exhaustion on large untrusted arrays. Fixed only in zod 4,
  # and this package stays on zod 3. identkit validates only operator configuration with zod
  # arrays; untrusted input reaches zod only as a single string (the e-mail address).
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5

# workerd (through miniflare, used by the runtime smoke test and the local D1 tests) has a
# postinstall that only downloads its binary when the platform package is missing. The platform
# package installs as an optional dependency, so the script does not need to run.
allowBuilds:
  workerd: false

# miniflare (dev only, runtime smoke test and local D1 tests) pins undici and sharp versions with
# known advisories. undici moves to a patched release; sharp serves only the Images binding,
# which the tests do not use, so it is removed.
overrides:
  miniflare>undici: 7.30.2
  miniflare>sharp: "-"
